name: Deploy sprite handoff desk
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare reviewed worksheet
        shell: python
        run: |
          from pathlib import Path
          Path("_site").mkdir(exist_ok=True)
          Path("_site/index.html").write_text('<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprite handoff desk — a practical review worksheet</title><style>body{margin:0;background:#f3f5fb;color:#1d2940;font:18px/1.7 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:32px 24px}h1,h2{line-height:1.2}h1{font-size:2.5em}h2{margin-top:2em}a{color:#1649a4}section,figure{background:white;border:1px solid #bbc7dd;border-radius:16px;padding:24px;margin:24px 0}label{display:block;padding:10px}input{width:20px;height:20px;margin-right:12px}button{font:inherit;padding:10px 18px;background:#223b69;color:white;border:0;border-radius:8px}svg{width:100%;height:auto}small{font-size:.85em}footer{border-top:1px solid;padding-top:20px}</style></head><body><main><header><h1>Sprite handoff desk</h1><p>A review worksheet for moving a character concept into the next stage without hiding unfinished work.</p></header><figure><svg viewBox="0 0 780 150" role="img" aria-labelledby="diagramtitle"><title id="diagramtitle">Four review stages: brief, inspect, export, hand off</title><g fill="#e6edf9" stroke="#223b69" stroke-width="2"><rect x="10" y="30" width="165" height="80" rx="10"/><rect x="210" y="30" width="165" height="80" rx="10"/><rect x="410" y="30" width="165" height="80" rx="10"/><rect x="610" y="30" width="160" height="80" rx="10"/></g><g font-family="sans-serif" font-size="23" fill="#223b69" text-anchor="middle"><text x="92" y="80">Brief</text><text x="292" y="80">Inspect</text><text x="492" y="80">Export</text><text x="690" y="80">Hand off</text><text x="192" y="80">→</text><text x="392" y="80">→</text><text x="592" y="80">→</text></g></svg><figcaption>Original workflow diagram. This is a process illustration, not a screenshot or a generated sprite.</figcaption></figure><section aria-labelledby="worksheet-title"><h2 id="worksheet-title">Temporary review reminders</h2><p>These checkboxes are manual reminders, not automatic tests. Reloading clears them. They do not upload an image, inspect a file or certify an asset.</p><label><input type="checkbox">The intended role and display size are written down.</label><label><input type="checkbox">The silhouette was checked against real backgrounds.</label><label><input type="checkbox">Required views were compared for consistency.</label><label><input type="checkbox">The actual PNG export was inspected.</label><label><input type="checkbox">Reference permissions and privacy were reviewed.</label><label><input type="checkbox">Untested integration steps are explicitly listed.</label><p id="count" aria-live="polite">0 of 6 reminders checked</p><button type="button" id="reset">Clear reminders</button></section><article><h2>Make a handoff decision, not a vague quality claim</h2><p>A sprite handoff is a communication task as much as a drawing task. The next person needs to know what the image is meant to do, which checks have been completed and which assumptions remain unresolved. An attractive draft can be a useful starting point without being a finished asset. Calling it ready before defining the next step creates confusion: ready for visual feedback, ready for a prototype and ready for release describe different decisions.</p><p>This worksheet accompanies Sprite Maker, a browser-based tool at <a href="https://spritemaker.app/">https://spritemaker.app/</a> that combines AI character generation with local pixel refinement and transparent PNG exports. The project includes direction views and NPC sets. This page is associated with the project and prepared with AI assistance. The guidance is not an independent product review, a measured comparison, legal advice or evidence that a particular game engine has been tested. The manual reminders above simply help organize a review.</p><h2>Begin with the receiving context</h2><p>Ask where the file will go next. A portrait for a conversation panel does not have the same requirements as a walking character viewed from above. An early concept board may tolerate inconsistent dimensions that would be troublesome in a production sheet. Write the intended use in ordinary language before choosing a format or generating more variants. Include the expected display size and the backgrounds on which the character must remain readable.</p><p>Specify a few stable features that another person can recognize. A round helmet, a short scarf or a lantern can help identify a character, but a long list of details may disappear at small sizes. Distinguish essential features from optional decoration. If the next reviewer cannot tell whether a missing accessory is a defect or an intentional simplification, the brief has left too much implicit. A compact description is often easier to evaluate than an elaborate mood board without priorities.</p><h2>Separate exploration from correction</h2><p>Exploration asks what the character could be. Correction asks how to resolve a particular problem in an existing draft. These are different jobs, and mixing them can lead to repeated generation without a clear stopping point. During exploration, compare broad shapes, roles and palettes. During correction, choose one issue such as an unclear outline or an inconsistent accessory and state the intended change before editing. Keep the original draft available so the effect can be compared.</p><p>Use local pixel editing when the desired correction is already understood. Removing an isolated mark or simplifying a highlight may be more predictable than requesting another complete variation. Conversely, extensive local repair may be premature if the basic character direction has not been chosen. The point is not to prescribe one method for every problem. It is to make the reason for the next action visible, so the team can decide whether that action addresses the current uncertainty.</p><h2>Review what survives at actual size</h2><p>Open the draft at its intended display size before relying on a large editor preview. Fine costume details can look convincing when magnified and become visual noise when reduced. Check the overall silhouette, the relationship between head and body, and the features needed to communicate the character\'s role. If the image is difficult to read, consider simplifying it rather than adding another shade or sharper internal detail.</p><p>Background tests should reflect the project, not only the editor\'s checkerboard. Compare the character on a light surface, a dark surface and a representative busy scene when those conditions are relevant. Describe failures specifically: a boot disappears into the floor, a hat merges with foliage, or a hand is confused with an accessory. Specific observations make it possible to judge the next revision. A general note that the sprite needs polish does not tell anyone what to change.</p><h2>Compare views as one identity</h2><p>A direction set can contain individually attractive images that do not feel like the same character. Place the required views together and compare proportions, clothing shapes and identifying features. Some variation follows naturally from perspective, while other changes may be accidental. Use the brief as the anchor for that discussion. Do not automatically make every view match whichever image happens to be the most detailed, because detail alone is not the acceptance criterion.</p><p>Direction views are also different from motion frames. A stationary front view and side view do not establish a walk cycle, an attack sequence or a smooth turn. Motion needs its own timing and pose review in the intended environment. Label a set according to the work actually completed, and keep animation status separate. If movement has not been tested, record it as untested rather than using a broad claim such as game-ready.</p><h2>Inspect the export as a new object</h2><p>The exported file deserves its own inspection. Open the actual transparent PNG that will be handed off and check the edges, visible background pixels, clipping and dimensions. An editor can display a convincing preview even when the next application interprets placement differently. Testing the exported file at this boundary is a modest, concrete step; it does not require pretending that every later integration concern has already been solved.</p><p>If a consumer expects a fixed cell size, a particular grid or a named origin point, document that requirement explicitly. A filename does not prove a layout, and an image centered in a preview does not define the correct pivot for every engine. Keep declared metadata separate from measurements and visual review. A script that checks declared rows and columns may be useful, but passing that check does not establish that the artwork moves naturally or communicates the intended action.</p><h2>Write revision notes that explain decisions</h2><p>Names such as final-new-fixed make a folder difficult to navigate. Use a consistent character identifier, view label and revision marker instead. Add a short note describing the reason for a change. For example, simplifying a helmet edge because it broke up at the target size gives the next reviewer a specific observation to verify. Saying only that the image is better hides the decision and makes later comparisons more subjective than necessary.</p><p>Keep shared style decisions separate from character-specific traits when reviewing an NPC set. Outline treatment, approximate scale and palette limits might apply across the set, while a distinctive accessory helps differentiate one person from another. Both levels need review. Uniform styling can still produce characters that are hard to distinguish, and varied characters can still look as though they belong to unrelated projects. Neither consistency nor variety should be assumed solely from how the images were generated.</p><h2>Keep rights and privacy beside creative notes</h2><p>Use references you have permission to provide, and check the service\'s current privacy terms before uploading confidential artwork. The technical ability to transform or generate an image does not resolve every permission question associated with its use. If an output resembles an existing character closely, treat that as a review issue before a commercial release. Keep the relevant reference sources and usage decisions with the asset rather than scattering them across messages that will be hard to retrieve later.</p><p>Sprite Maker provides free local editing and exports, and its site describes one free AI generation per account. Additional AI generation uses credits through subscriptions or one-time packs. Check the current terms and allowances before planning a larger session. A clear review process can help explain why another draft is needed, but this worksheet makes no measured claim about cost savings, speed or commercial rights. Those decisions depend on the actual project and current service conditions.</p><h2>Use the reminders without overinterpreting them</h2><p>The six checkboxes are intentionally simple. They record a person\'s temporary acknowledgment that a topic has been considered; they do not examine the sprite or verify the evidence. Checking all six is not a certificate of quality. If a reminder does not apply, keep that explanation in the handoff notes. If a review discovers an unresolved issue, record the issue rather than checking the item merely to make the counter look complete.</p><p>The reminder controls on this page use ordinary browser checkboxes and a clear button. Their state is temporary and resets when the page is reloaded. Copy important decisions into the project\'s own documentation before leaving. The worksheet does not request private artwork, credentials or project files. Hosting providers may add their own infrastructure or analytics, so these statements describe the worksheet\'s controls rather than making a sweeping claim about every part of the hosting service.</p><h2>Hand off a clear next action</h2><p>End the review with a small decision: accept the draft for a prototype, request a specific correction, or return to concept exploration. List the checks that were actually performed and the limitations that remain. A collaborator should be able to understand what to do next without reconstructing the entire generation session. That clarity is more useful than a large collection of images with no explanation of which one to use or why it was selected.</p><p>A disciplined handoff does not remove human judgment. It makes judgment easier to inspect. Generation provides possibilities, local editing addresses known problems, and integration tests examine behavior in a receiving environment. Keeping those activities distinct helps a team avoid treating one attractive output as proof that all the work is complete. The goal is a reviewed file with an understandable history, not an unsupported promise that every generated character is ready immediately.</p></article><footer><small>Project-associated educational resource. Manual worksheet; no automatic asset certification.</small></footer></main><script>const boxes=[...document.querySelectorAll(\'input[type=checkbox]\')];const update=()=>document.getElementById(\'count\').textContent=boxes.filter(b=>b.checked).length+\' of 6 reminders checked\';boxes.forEach(b=>b.addEventListener(\'change\',update));document.getElementById(\'reset\').addEventListener(\'click\',()=>{boxes.forEach(b=>b.checked=false);update()});</script></body></html>', encoding="utf-8")
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
